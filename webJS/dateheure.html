<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>affichage date et heure</title>
    <script src="./assets/js/script.js" async></script>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <main>
    <fieldset id="dateDay"><legend>Date et heure du jour</legend>
    <div class="wrap">

        <label for="txtDate" class="fixe">Date du jour</label> <input type="date" name="txtDate" id="txtDate" > 
        <button id="btnDate"> Afficher Date</button>
       <!-- <input type="button" value="afficher Date" id="btnDate" -->
    </div>
 <div class="wrap">

        <label for="txtHour" class="fixe">Heure locale</label> <input type="datetime-local" name="txtHour" id="txtHour" > 
        <button id="btnHour"> Afficher heure</button>
       <!-- <input type="button" value="afficher Date" id="btnDate" -->
    </div>


    </fieldset>
    </main>
</body>
</html>
